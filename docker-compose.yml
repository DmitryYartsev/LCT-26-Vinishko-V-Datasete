services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: vino
      POSTGRES_PASSWORD: vino
      POSTGRES_DB: vino
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vino"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"

  # Разовая инициализация БД: если база пустая и есть дамп (deploy/fetch_data.sh кладёт его
  # в deploy/archives/pgvector.dump) — восстанавливает векторы индекса, иначе просто выходит.
  # ml ждёт завершения этого шага, поэтому гонки «индекс строится с нуля» не возникает.
  db-init:
    image: pgvector/pgvector:pg16
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: vino
      PGPASSWORD: vino
      PGDATABASE: vino
      DUMP_FILE: /deploy/archives/pgvector.dump
    volumes:
      - "./deploy:/deploy:ro"
    entrypoint: ["sh", "/deploy/db_init.sh"]
    depends_on:
      db:
        condition: service_healthy
      fetch:
        condition: service_completed_successfully

  # Скачивание данных/моделей — часть обычного запуска: на чистой машине достаточно
  # `git clone` + `docker compose up --build`. Сервис проверяет артефакты и качает только
  # отсутствующее (повторный `up` ничего не тянет). Спутники (db-init, ml) ждут его завершения.
  # Только stdlib python — поэтому берём чистый python-образ.
  # Ручной запуск: docker compose run --rm fetch [--status|--check|--force|--only data,dump]
  fetch:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - "./deploy:/app/deploy"
      - "./data:/app/data"
      - "./filtered:/app/filtered"
      - "./models:/app/models"
    entrypoint: ["python3", "/app/deploy/fetch_data.py"]

  ml:
    build:
      context: "./ML service"
    environment:
      DATABASE_URL: postgresql://vino:vino@db:5432/vino
      SEARCH_ENCODER: ${SEARCH_ENCODER:-auto}
      SEARCH_MODEL: ${SEARCH_MODEL:-google/siglip2-base-patch16-256}
      SEARCH_BACKEND: ${SEARCH_BACKEND:-local}
      SEARCH_API_URL: ${SEARCH_API_URL:-}
      SEARCH_API_TOKEN: ${SEARCH_API_TOKEN:-}
      CROP_ENABLED: ${CROP_ENABLED:-1}
      CROP_MODEL: ${CROP_MODEL:-/app/models/yolo11n.pt}
      USE_LABEL_BRANCH: ${USE_LABEL_BRANCH:-1}
      LABEL_MODEL: ${LABEL_MODEL:-/app/models/label_det_best.pt}
      SEARCH_PIPELINE: ${SEARCH_PIPELINE:-combined}
      # Гейт «есть в каталоге»: значения по умолчанию — из калибровки (reports/27_gate_negatives.md).
      # Источник истины — config/pipeline.yaml (pipeline_config.py перекрывает env из YAML).
      THRESH_SCORE: ${THRESH_SCORE:-0.81}
      THRESH_SCORE_LO: ${THRESH_SCORE_LO:-0.70}
      OCR_CONFIRM_CONF: ${OCR_CONFIRM_CONF:-0.80}
      OCR_AGREE_CONF: ${OCR_AGREE_CONF:-0.60}
      THRESH_MARGIN: ${THRESH_MARGIN:-0.015}
      # OCR-rerank
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      PIPELINE_CONFIG: /app/config/pipeline.yaml
    volumes:
      - "./paths.py:/app/paths.py:ro"
      - "./ML service:/app/ml"
      - "./filtered:/app/filtered:ro"
      - "./models:/app/models"
      - "./config:/app/config:ro"
      # каталог/эталоны — из репозитория (папка data внутри проекта, не ../data)
      - "./data:/app/ref:ro"
      - "./ML service/prompts_wine_match.txt:/app/prompts_wine_match.txt:ro"
      - hfcache:/models_cache
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      fetch:
        condition: service_completed_successfully
    ports:
      - "8080:8080"

  sommelier:
    build:
      context: "./sommelier service"
    environment:
      DATABASE_URL: postgresql://vino:vino@db:5432/vino
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-google/gemini-2.5-flash}
      STT_MODEL: ${STT_MODEL:-google/gemini-2.5-flash}
    volumes:
      - "./paths.py:/app/paths.py:ro"
      - "./sommelier service:/app/sommelier service"
      # папку монтируем целиком (а не файл catalog.csv): иначе на чистой машине docker
      # создаёт на месте отсутствующего файла каталог и fetch не может туда распаковать архив
      - "./filtered:/app/filtered:ro"
    depends_on:
      db:
        condition: service_healthy
      fetch:
        condition: service_completed_successfully
    ports:
      - "8090:8090"

  web:
    build:
      context: "./web"
    environment:
      NUXT_ML_URL: http://ml:8080
      NUXT_SOMMELIER_URL: http://sommelier:8090
      # 1 — показывать в UI время поиска, сходство и score/margin (для демо)
      NUXT_PUBLIC_DEBUG_INFO: ${DEBUG_INFO:-0}
    depends_on:
      - ml
      - sommelier
    ports:
      - "3000:3000"

volumes:
  pgdata:
  hfcache:
